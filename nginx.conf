# Last good API answer is kept so visitors still see data if the status backend is down or restarting.
proxy_cache_path /var/cache/status-cache levels=1 keys_zone=status:1m max_size=5m inactive=7d use_temp_path=off;

# The API is re-resolved continuously (nginx >= 1.27.3): nginx still starts if the API is absent, and a vanished
# API counts as an upstream error, so proxy_cache_use_stale below can serve the last good answer.
# Docker's embedded DNS (http scope: used by the upstream below).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream status_api {
    zone status_api 64k;
    server status-api:8000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz { default_type text/plain; return 200 'ok'; }

    location /api/ {
        proxy_pass http://status_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_cache status;
        proxy_cache_key $uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 4s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_next_upstream error timeout;
        proxy_hide_header Cache-Control;  # the API sends its own no-store; avoid a duplicate
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Missing assets are a real 404, not the index page. add_header is not inherited once a location sets its own.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Only the exact root serves the page; any other unknown path is a 404 (relative asset URLs would break otherwise).
    # These two locations set no add_header of their own, so they inherit the server-level security headers.
    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
