<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/status.css">
</head>
<body>
<main class="wrap" id="main">
  <h1 id="title">Status</h1>
  <div id="banner" class="banner unknown" role="status" aria-live="polite">Loading…</div>
  <p id="notice" class="notice" hidden></p>
  <div id="groups" aria-label="Components"></div>
  <section aria-labelledby="inc-title">
    <h2 id="inc-title" class="section-title">Past incidents</h2>
    <div id="incidents"></div>
  </section>
  <p id="updated" class="updated"></p>
</main>
<script src="assets/status.js"></script>
</body>
</html>
